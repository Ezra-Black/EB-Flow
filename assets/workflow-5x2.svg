<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1000" viewBox="0 0 2500 1000" role="img" aria-labelledby="title desc">
  <title id="title">EBFlow workflow 5:2</title>
  <desc id="desc">Wide article banner of the EBFlow Railway/DB multi-agent feedback loop with safeguards.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#4a6a5d" stroke-opacity="0.2" stroke-width="0.7"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#4a6a5d"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#e85d04"/>
    </marker>
    <marker id="arrow-ok" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#4a8c5c"/>
    </marker>
    <marker id="arrow-fail" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#e85d04"/>
    </marker>
  </defs>

  <rect width="2500" height="1000" fill="#0a1612"/>
  <rect width="2500" height="1000" fill="url(#grid)"/>
  <rect x="2" y="2" width="2496" height="996" fill="none" stroke="#4a6a5d" stroke-opacity="0.55"/>

  <!-- header -->
  <text x="40" y="48" fill="#e85d04" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" letter-spacing="2">EBFLOW // PRODUCTION MULTI-AGENT WORKFLOW</text>
  <text x="40" y="78" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">Railway / DB feedback loop with safeguards</text>

  <rect x="1680" y="28" width="780" height="62" fill="#0f1f1a" stroke="#d4a017" stroke-width="1.5"/>
  <text x="1700" y="54" fill="#d4a017" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">STATUS MACHINE</text>
  <text x="1700" y="76" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">pending -&gt; processing -&gt; validated -&gt; applied -&gt; completed</text>

  <!-- ROW 1: main -> users -> db -> event -> ingress -->
  <rect x="40" y="130" width="360" height="88" fill="#0f1f1a" stroke="#3a7a8c" stroke-width="1.8"/>
  <text x="58" y="162" fill="#3a7a8c" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">01 MAIN AGENT</text>
  <text x="58" y="188" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">Receives Task / Domain / Project</text>
  <text x="58" y="208" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">owns intent, context, completion</text>

  <path d="M400 174 H430" fill="none" stroke="#4a6a5d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="440" y="130" width="320" height="88" fill="#0f1f1a" stroke="#4a8c5c" stroke-width="1.8"/>
  <text x="458" y="162" fill="#4a8c5c" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">02 USERS</text>
  <text x="458" y="188" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">Website / API requests</text>
  <text x="458" y="208" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">intent enters the system</text>

  <path d="M760 174 H790" fill="none" stroke="#4a6a5d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="800" y="130" width="360" height="88" fill="#0f1f1a" stroke="#4a8c5c" stroke-width="1.8"/>
  <text x="818" y="162" fill="#4a8c5c" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">03 DB WRITE</text>
  <text x="818" y="188" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">Railway + Database update</text>
  <text x="818" y="208" fill="#d4a017" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">status = pending + version</text>

  <path d="M1160 174 H1190" fill="none" stroke="#4a6a5d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1168" y="158" fill="#4a6a5d" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">event</text>

  <rect x="1200" y="130" width="360" height="88" fill="#0f1f1a" stroke="#8a5a8a" stroke-width="1.8"/>
  <text x="1218" y="162" fill="#8a5a8a" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">04 SUB-AGENT (INGRESS)</text>
  <text x="1218" y="188" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">Receives DB / Railway change</text>
  <text x="1218" y="208" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">checks version + status + debounce</text>

  <path d="M1560 174 H1590" fill="none" stroke="#4a6a5d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- route diamond-ish box for wide layout -->
  <rect x="1600" y="130" width="340" height="88" fill="#0f1f1a" stroke="#e85d04" stroke-width="1.8"/>
  <text x="1618" y="162" fill="#e85d04" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">05 ROUTE LAYER</text>
  <text x="1618" y="188" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">CRUD system or API layer?</text>
  <text x="1618" y="208" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">route early, classify failures</text>

  <path d="M1940 174 H1970" fill="none" stroke="#4a6a5d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1980" y="120" width="480" height="108" fill="#0f1f1a" stroke="#4a6a5d" stroke-width="1.4"/>
  <text x="2000" y="148" fill="#4a6a5d" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">NOTE</text>
  <text x="2000" y="174" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">Idempotency required on</text>
  <text x="2000" y="196" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">validator and updater</text>
  <text x="2000" y="218" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">safe under webhook redelivery</text>

  <!-- ROW 2: validate -> handoff -> apply | fail path -->
  <path d="M1770 218 V270" fill="none" stroke="#4a6a5d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="280" width="420" height="110" fill="#0f1f1a" stroke="#4a8c5c" stroke-width="1.8"/>
  <text x="58" y="312" fill="#4a8c5c" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">06 NEW SUB-AGENT (VALIDATOR)</text>
  <text x="58" y="340" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">Validates change against systems</text>
  <text x="58" y="364" fill="#d4a017" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">MUST be idempotent | writes receipt</text>
  <text x="58" y="384" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">no production mutation here</text>

  <!-- connect route down-left to validator visually -->
  <path d="M1770 270 H250" fill="none" stroke="#4a6a5d" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M250 270 V280" fill="none" stroke="#4a6a5d" stroke-width="1.4" marker-end="url(#arrow)"/>

  <path d="M460 335 H500" fill="none" stroke="#4a8c5c" stroke-width="1.5" marker-end="url(#arrow-ok)"/>
  <text x="468" y="322" fill="#4a8c5c" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">PASS</text>

  <rect x="510" y="290" width="380" height="90" fill="#0f1f1a" stroke="#8a5a8a" stroke-width="1.8"/>
  <text x="528" y="322" fill="#8a5a8a" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">07 HANDOFF</text>
  <text x="528" y="348" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">Hands validated info to Second Agent</text>
  <text x="528" y="370" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">receipt required before apply</text>

  <path d="M890 335 H930" fill="none" stroke="#4a6a5d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="940" y="280" width="420" height="110" fill="#0f1f1a" stroke="#e85d04" stroke-width="1.8"/>
  <text x="958" y="312" fill="#e85d04" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">08 SECOND AGENT (APPLY)</text>
  <text x="958" y="340" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">Updates Railway and systems</text>
  <text x="958" y="364" fill="#d4a017" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">sets status = applied</text>
  <text x="958" y="384" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">make it real only after validation</text>

  <!-- fail box -->
  <path d="M250 390 V430 H1480" fill="none" stroke="#e85d04" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M460 335 V410" fill="none" stroke="#e85d04" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="470" y="405" fill="#e85d04" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">FAIL</text>

  <rect x="1480" y="280" width="480" height="110" fill="#140c0a" stroke="#e85d04" stroke-width="1.8"/>
  <text x="1498" y="312" fill="#e85d04" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">VALIDATION FAILED</text>
  <text x="1498" y="340" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">write failed record</text>
  <text x="1498" y="364" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">retry with backoff</text>
  <text x="1498" y="384" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">OR escalate to human</text>

  <!-- loop prevention -->
  <rect x="2000" y="280" width="460" height="110" fill="#0f1f1a" stroke="#4a6a5d" stroke-width="1.5"/>
  <text x="2018" y="312" fill="#4a6a5d" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">LOOP PREVENTION</text>
  <text x="2018" y="340" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">1. version check</text>
  <text x="2018" y="364" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">2. status guard</text>
  <text x="2018" y="388" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">3. debounce lock</text>

  <!-- ROW 3: main complete + history + loop -->
  <path d="M1150 390 V450" fill="none" stroke="#4a6a5d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="460" width="700" height="110" fill="#0f1f1a" stroke="#3a7a8c" stroke-width="1.8"/>
  <text x="58" y="494" fill="#3a7a8c" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">09 MAIN / FIRST AGENT</text>
  <text x="58" y="522" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">Validates outcome + creates Custom MD / Context</text>
  <text x="58" y="548" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">remembers steps and iterating changes</text>

  <path d="M740 515 H780" fill="none" stroke="#4a6a5d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="790" y="460" width="700" height="110" fill="#0f1f1a" stroke="#d4a017" stroke-width="1.8"/>
  <text x="808" y="494" fill="#d4a017" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">10 HISTORY REPORT</text>
  <text x="808" y="522" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">Updates history report in DB</text>
  <text x="808" y="548" fill="#e85d04" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">sets status = completed + new version</text>

  <path d="M1490 515 H1540" fill="none" stroke="#e85d04" stroke-width="1.8" marker-end="url(#arrow-accent)"/>

  <rect x="1550" y="460" width="910" height="110" fill="#0f1f1a" stroke="#e85d04" stroke-width="1.8"/>
  <text x="1570" y="494" fill="#e85d04" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">LOOP CONTROL</text>
  <text x="1570" y="522" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">Return to Main Agent only if status = completed</text>
  <text x="1570" y="548" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16">AND a new version is detected</text>

  <!-- return path -->
  <path d="M2460 515 H2480 V90 H220" fill="none" stroke="#e85d04" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-accent)"/>
  <text x="1880" y="82" fill="#e85d04" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">feedback only under loop control</text>

  <!-- bottom band -->
  <rect x="40" y="640" width="2420" height="300" fill="#0f1f1a" stroke="#4a6a5d" stroke-width="1.2"/>
  <text x="70" y="690" fill="#e85d04" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20">WHY THIS MATTERS</text>
  <text x="70" y="735" fill="#c5ddd2" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18">Agents can wake often. They do not get to act every time.</text>
  <text x="70" y="780" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17">Validate and apply stay separate. Failures write records, retry with backoff, or escalate.</text>
  <text x="70" y="825" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17">Custom MD/Context + history report make the run explainable after the chat is gone.</text>
  <text x="70" y="880" fill="#4a6a5d" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">LEGEND</text>
  <rect x="70" y="900" width="18" height="18" fill="#0a1612" stroke="#3a7a8c" stroke-width="1.5"/>
  <text x="98" y="914" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">main agent</text>
  <rect x="240" y="900" width="18" height="18" fill="#0a1612" stroke="#4a8c5c" stroke-width="1.5"/>
  <text x="268" y="914" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">entry / validate</text>
  <rect x="460" y="900" width="18" height="18" fill="#0a1612" stroke="#8a5a8a" stroke-width="1.5"/>
  <text x="488" y="914" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">ingress / handoff</text>
  <rect x="700" y="900" width="18" height="18" fill="#0a1612" stroke="#e85d04" stroke-width="1.5"/>
  <text x="728" y="914" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">route / apply / fail / loop</text>
  <rect x="1040" y="900" width="18" height="18" fill="#0a1612" stroke="#d4a017" stroke-width="1.5"/>
  <text x="1068" y="914" fill="#8fb3a5" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">status / history</text>
  <text x="1800" y="914" fill="#4a6a5d" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">2500 x 1000  -  5:2  -  NERV palette</text>
</svg>
